
services:
  - type: web
    name: resumeiq-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app:app

    envVars:
      - key: MYSQL_HOST
        sync: false

      - key: MYSQL_PORT
        value: "13290"

      - key: MYSQL_USER
        sync: false

      - key: MYSQL_PASSWORD
        sync: false

      - key: MYSQL_DATABASE
        value: defaultdb

      - key: MYSQL_SSL_CA
        value: /etc/secrets/ca.pem
